<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">AquaHome 20-stage cartridge orientation</title>
  <desc id="desc">The mesh end of the cylindrical 20-stage cartridge faces incoming water from the shower arm.</desc>
  <rect width="800" height="460" rx="28" fill="#f9fafb"/>
  <text x="400" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#111827">20-stage cartridge</text>
  <text x="110" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1e40af">Shower arm</text>
  <path d="M55 145h145" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <path d="m182 125 28 20-28 20" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#1e40af">Incoming water</text>
  <g transform="translate(225 105)">
    <rect x="0" y="20" width="340" height="180" rx="42" fill="#e5e7eb" stroke="#374151" stroke-width="7"/>
    <ellipse cx="26" cy="110" rx="26" ry="90" fill="#d1d5db" stroke="#374151" stroke-width="7"/>
    <g stroke="#6b7280" stroke-width="3">
      <path d="M8 48l36 30M7 78l38 30M7 108l38 30M7 138l38 30M8 168l28 24"/>
      <path d="M42 44L8 76M45 72L7 108M45 102L7 138M45 132L8 168M44 164l-24 28"/>
    </g>
    <rect x="68" y="45" width="235" height="130" rx="22" fill="#fbbf24" stroke="#b45309" stroke-width="4"/>
    <circle cx="105" cy="82" r="13" fill="#f97316"/><circle cx="148" cy="83" r="13" fill="#fde047"/><circle cx="191" cy="82" r="13" fill="#a3e635"/><circle cx="234" cy="83" r="13" fill="#38bdf8"/><circle cx="277" cy="82" r="13" fill="#c084fc"/>
    <circle cx="105" cy="132" r="13" fill="#38bdf8"/><circle cx="148" cy="133" r="13" fill="#c084fc"/><circle cx="191" cy="132" r="13" fill="#f97316"/><circle cx="234" cy="133" r="13" fill="#fde047"/><circle cx="277" cy="132" r="13" fill="#a3e635"/>
    <text x="28" y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#166534">MESH END</text>
    <text x="28" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#166534">faces water source</text>
  </g>
  <path d="M585 215h130" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <path d="m697 195 28 20-28 20" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="654" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#166534">To shower head</text>
  <rect x="65" y="385" width="670" height="48" rx="14" fill="#dcfce7"/>
  <text x="400" y="417" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#166534">Install the mesh end upstream, toward the shower arm.</text>
